workflows:
  ios-testflight:
    name: Puppysteps iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: codemagic-app-store-connect

    environment:
      node: v22.13.1
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.eaconsulting.puppysteps

      vars:
        XCODE_WORKSPACE: Puppysteps.xcworkspace
        XCODE_SCHEME: Puppysteps
        APP_STORE_APPLE_ID: 6808203305

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Verify project
        script: npm run typecheck && npm run lint && npm test -- --runInBand

      - name: Generate iOS project
        script: npx expo prebuild --platform ios

      - name: Increment iOS build number
        script: |
          set -e
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID")
          NEXT_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          cd "$CM_BUILD_DIR/ios"
          agvtool new-version -all "$NEXT_BUILD_NUMBER"

      - name: Install CocoaPods
        script: cd ios && pod install

      - name: Apply code signing
        script: xcode-project use-profiles --project "$CM_BUILD_DIR/ios/Puppysteps.xcodeproj"

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
